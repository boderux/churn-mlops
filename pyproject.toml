[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"airflow/*" = ["E402"]
"src/churn/train.py" = ["E402", "I001"]
"src/churn/explain.py" = ["E402", "I001"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
