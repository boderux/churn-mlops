apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: churn-dev
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: churn-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler, name: churn-api}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
images:
  - name: churn-api
    newName: ghcr.io/your-org/churn-api
    newTag: latest   # updated automatically by .github/workflows/cd.yml
