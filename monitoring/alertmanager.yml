# Template: __BOT_TOKEN__ / __CHAT_ID__ are rendered from env at container start (see compose).
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: telegram
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__BOT_TOKEN__"
        chat_id: __CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ range .Alerts }}{{ if eq .Status "firing" }}{{ if eq .Labels.severity "critical" }}🚨{{ else }}⚠️{{ end }} <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ else }}✅ <b>RESOLVED</b>: {{ .Labels.alertname }}
          {{ end }}{{ end }}

inhibit_rules:
  - source_matchers: [alertname="ChurnApiDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95|ModelNotLoaded"]
    equal: []
