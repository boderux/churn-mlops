name: churn-mlops

x-airflow-common: &airflow-common
  build: { context: ., dockerfile: Dockerfile.airflow }
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    PROJECT_ROOT: /opt/project
    ARTIFACT_DIR: /opt/project/artifacts
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PUSHGATEWAY_URL: http://pushgateway:9091
    API_URL: http://api:8000
    ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # MinIO / S3 object storage
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    MINIO_ENDPOINT_URL: http://minio:9000
    AWS_DEFAULT_REGION: us-east-1
    MLFLOW_S3_IGNORE_TLS: "true"
    MINIO_DATA_BUCKET: ${MINIO_DATA_BUCKET:-churn-data}
    MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-churn-reports}
    MINIO_ARTIFACTS_BUCKET: ${MINIO_ARTIFACTS_BUCKET:-churn-artifacts}
  volumes:
    - ./:/opt/project
  depends_on:
    airflow-db: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: "mlflow,churn-data,churn-reports,churn-artifacts"
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: Dockerfile }
    image: churn-api:local
    ports: [ "8000:8000" ]
    environment:
      ARTIFACT_DIR: /app/artifacts
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      PREDICTION_LOG: /app/artifacts/prediction_log.jsonl
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./artifacts:/app/artifacts # shared with Airflow: champion model + prediction log
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mlflow:
    build: { context: ., dockerfile: Dockerfile.mlflow }
    image: churn-mlflow:local
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root s3://mlflow/ --artifacts-destination s3://mlflow/ --serve-artifacts
    ports: [ "5000:5000" ]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
    volumes: [ mlflow-data:/mlflow ]
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    volumes: [ airflow-db:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname a --lastname b --role Admin --email admin@example.com --password $${AIRFLOW_ADMIN_PASSWORD:-admin} || true"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)" ]
      interval: 30s
      timeout: 15s
      retries: 5
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: [ "${AIRFLOW_WEBSERVER_PORT:-8085}:8080" ]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports: [ "9091:9091" ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d" ]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports: [ "9090:9090" ]
    depends_on: [ api, alertmanager, pushgateway ]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/healthy" ]
      interval: 15s
      retries: 5
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # Alertmanager cannot read env vars -> render the Telegram token/chat id at start-up.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        sed -e "s|__BOT_TOKEN__|$${TELEGRAM_BOT_TOKEN}|" -e "s|__CHAT_ID__|$${TELEGRAM_CHAT_ID}|" /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-000000:not-configured}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-1}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
    ports: [ "9093:9093" ]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9093/-/healthy" ]
      interval: 15s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: [ "3000:3000" ]
    depends_on: [ prometheus ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok" ]
      interval: 15s
      retries: 5
    restart: unless-stopped

volumes:
  minio-data:
  mlflow-data:
  airflow-db:
  prometheus-data:
  grafana-data:
