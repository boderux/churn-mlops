name: CD

# GitOps: this workflow builds the image, pushes/loads to cluster, and bumps the tag in git.
# ArgoCD (watching k8s/overlays/*) detects the commit and syncs the cluster.
#   push to main  -> image :sha  -> dev overlay   (auto-deployed by ArgoCD)
#   tag  v*.*.*   -> image :tag  -> prod overlay  (auto-deployed by ArgoCD)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/churn-api

jobs:
  build-and-push:
    name: Build & Deploy Image (Self-Hosted)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Add runner tools to PATH
        run: |
          "E:\actions-runner\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Docker\Docker\resources\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compute Image Tag
        id: meta
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ("${{ github.event.workflow_run.head_sha }}") {
            $tag = "sha-" + "${{ github.event.workflow_run.head_sha }}".Substring(0,8)
          } else {
            $tag = "sha-" + $env:GITHUB_SHA.Substring(0,8)
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Computed tag: $tag"

      - name: Ensure Champion Artifacts Exist
        run: |
          if (-not (Test-Path "artifacts/champion/model.joblib")) {
            Write-Host "Artifacts not in workspace, attempting copy from local project..."
            New-Item -ItemType Directory -Force -Path "artifacts/champion" | Out-Null
            if (Test-Path "C:\Users\boder\Downloads\churn-mlops\churn-mlops\artifacts\champion") {
              Copy-Item "C:\Users\boder\Downloads\churn-mlops\churn-mlops\artifacts\champion\*" -Destination "artifacts/champion" -Recurse -Force
            }
          }
          Get-ChildItem artifacts/champion

      - name: Build Docker Image
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          Write-Host "Building Docker image for tag: $tag"
          docker build `
            --build-arg GIT_SHA="${{ github.sha }}" `
            -t "${{ env.IMAGE }}:$tag" `
            -t "${{ env.IMAGE }}:latest" `
            -t "churn-api:$tag" `
            -t "churn-api:latest" `
            .

      - name: Load Image directly into Kind Cluster
        run: |
          $env:Path = "E:\actions-runner\bin;C:\Program Files\Docker\Docker\resources\bin;" + $env:Path
          $tag = "${{ steps.meta.outputs.tag }}"
          Write-Host "Loading image ${{ env.IMAGE }}:$tag into local kind cluster 'churn-cluster'..."
          kind load docker-image "${{ env.IMAGE }}:$tag" --name churn-cluster
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Kind image load returned exit code $LASTEXITCODE; continuing workflow."
          }
          $global:LASTEXITCODE = 0

      - name: Push to GitHub Container Registry (GHCR)
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          if ("${{ secrets.GITHUB_TOKEN }}") {
            try {
              "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
              docker push "${{ env.IMAGE }}:$tag"
              docker push "${{ env.IMAGE }}:latest"
            } catch {
              Write-Warning "GHCR push skipped or failed; local kind image is ready."
            }
          }
          $global:LASTEXITCODE = 0

  bump-manifest:
    name: Bump Overlay & GitOps Sync
    needs: build-and-push
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Add runner tools to PATH
        run: |
          "E:\actions-runner\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Docker\Docker\resources\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Image Tag in Kustomize Overlay
        run: |
          $env:Path = "E:\actions-runner\bin;C:\Program Files\Docker\Docker\resources\bin;" + $env:Path
          $overlay = "dev"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $overlay = "prod"
          }
          Write-Host "Target overlay: $overlay"
          Set-Location "k8s/overlays/$overlay"
          $imageArg = "churn-api=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }}"
          kustomize edit set image $imageArg
          "OVERLAY=$overlay" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit & Push to Git (Triggers ArgoCD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays
          $diff = git diff --cached --name-only
          if ($diff) {
            git commit -m "cd: deploy ${{ needs.build-and-push.outputs.tag }} to $env:OVERLAY [skip ci]"
            git pull --rebase origin main
            try {
              git push origin HEAD:main
            } catch {
              Write-Host "Standard push failed, trying with GITHUB_TOKEN..."
              git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
            }
          } else {
            Write-Host "No manifest changes to commit."
          }
          $global:LASTEXITCODE = 0

      - name: Instant Rollout Restart in Local Kubernetes Cluster
        run: |
          $env:Path = "E:\actions-runner\bin;C:\Program Files\Docker\Docker\resources\bin;" + $env:Path
          Write-Host "Triggering immediate rollout restart for $env:OVERLAY..."
          try {
            if ($env:OVERLAY -eq "prod") {
              kubectl rollout restart deployment/churn-api -n churn
              kubectl rollout status deployment/churn-api -n churn --timeout=60s
            } else {
              kubectl rollout restart deployment/churn-api -n churn-dev
              kubectl rollout status deployment/churn-api -n churn-dev --timeout=60s
            }
          } catch {
            Write-Warning "Kubectl rollout restart warning: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Telegram Notification
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          if (-not $env:TOKEN) { exit 0 }
          $text = "🚀 <b>churn-mlops CD (Self-Hosted)</b>: $($env:STATUS)`nImage: ${{ needs.build-and-push.outputs.tag }} → $($env:OVERLAY)`nLocal Kind cluster & ArgoCD updated."
          $uri = "https://api.telegram.org/bot$($env:TOKEN)/sendMessage"
          $body = @{
            chat_id = $env:CHAT
            parse_mode = "HTML"
            text = $text
          }
          try {
            Invoke-RestMethod -Uri $uri -Method Post -Body $body
          } catch {
            Write-Warning "Telegram send warning: $_"
          }
          $global:LASTEXITCODE = 0
