name: CD

# GitOps: this workflow only BUILDS the image and bumps the tag in git.
# ArgoCD (watching k8s/overlays/*) detects the commit and syncs the cluster.
#   push to main  -> image :sha  -> dev overlay   (auto-deployed by ArgoCD)
#   tag  v*.*.*   -> image :tag  -> prod overlay  (auto-deployed by ArgoCD)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/churn-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Train the production champion (full pipeline, gated)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m churn.cli run-all
      - id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else echo "tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "0"        # report only; set to 1 to block deployments

  bump-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: imranismail/setup-kustomize@v2
      - name: Set image tag in the right overlay
        run: |
          OVERLAY=dev; [[ "$GITHUB_REF" == refs/tags/* ]] && OVERLAY=prod
          cd k8s/overlays/$OVERLAY
          kustomize edit set image churn-api=${IMAGE}:${{ needs.build-and-push.outputs.tag }}
          echo "OVERLAY=$OVERLAY" >> $GITHUB_ENV
      - name: Commit (ArgoCD picks it up)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays
          git diff --cached --quiet || git commit -m "cd: deploy ${{ needs.build-and-push.outputs.tag }} to $OVERLAY [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Telegram notification
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" -d parse_mode=HTML \
            -d text="🚀 <b>churn-mlops CD</b>: ${STATUS}%0AImage: ${{ needs.build-and-push.outputs.tag }} → ${OVERLAY:-?}%0AArgoCD will sync automatically."
