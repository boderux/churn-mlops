name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests airflow scripts
      - run: mypy src

  test:
    name: Tests (unit / integration / data / model) + coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Run test-suite (fails under 80 % coverage)
        run: pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: "coverage.xml\nreport.xml"}

  dags:
    name: Airflow DAG import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install Airflow (pinned with constraints)
        run: |
          pip install "apache-airflow==2.9.3" requests \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-${{ env.PYTHON_VERSION }}.txt"
      - name: Load DAGs
        env: {AIRFLOW_HOME: /tmp/airflow, PROJECT_ROOT: "${{ github.workspace }}"}
        run: |
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert {"churn_training_pipeline", "churn_drift_monitoring"} <= set(bag.dags)
          print("DAGs OK:", sorted(bag.dags))
          PY

  manifests:
    name: Validate Kubernetes / ArgoCD manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Render overlays
        run: |
          kustomize build k8s/overlays/dev  > /tmp/dev.yaml
          kustomize build k8s/overlays/prod > /tmp/prod.yaml
      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/dev.yaml /tmp/prod.yaml argocd/application-*.yaml argocd/project.yaml

  docker:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.txt
      - name: Train a quick champion to bake into the image
        run: PYTHONPATH=src python -m churn.cli run-all --quick
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -e ADMIN_TOKEN=ci churn-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break || sleep 2; done
          python scripts/simulate_traffic.py --n 20 --rps 100 | tee /dev/stderr | grep "failed=0"
          curl -fsS localhost:8000/metrics | grep -q churn_predictions_total
          docker logs api | tail -n 20
